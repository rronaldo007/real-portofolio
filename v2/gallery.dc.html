<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior:smooth; }
  body { margin:0; background:#05060B; color:#EAECF5; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:rgba(155,107,255,.35); color:#fff; }
  :focus-visible { outline:2px solid #2BF1FF; outline-offset:3px; }
  .gtile { transition:transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s ease, border-color .4s ease; }
  .gtile .gzoom { transition:transform .6s cubic-bezier(.2,.7,.2,1); }
  .gtile:hover { transform:translateY(-5px); border-color:rgba(43,241,255,.4) !important; box-shadow:0 22px 46px rgba(0,0,0,.5), 0 0 28px rgba(43,241,255,.14); z-index:2; }
  .gtile:hover .gzoom { transform:scale(1.07); }
  .gtile .gidx { opacity:0; transition:opacity .3s ease; }
  .gtile:hover .gidx { opacity:1; }
  @media (max-width:680px) {
    .gmosaic { grid-template-columns:repeat(2,1fr) !important; }
    [data-gtile] { grid-column:span 1 !important; grid-row:span 2 !important; }
  }
  @keyframes lbin { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:scale(1); } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  (function(){ function go(n){ var w=document.querySelector('#dc-root [data-wipe]'); if(!w){ if(n<60) return setTimeout(function(){go(n+1)},50); return; } var r=matchMedia('(prefers-reduced-motion: reduce)').matches; if(r||!window.gsap){ w.style.display='none'; return;} window.gsap.to(w,{yPercent:-100,duration:.9,ease:'power4.inOut',onComplete:function(){w.style.display='none';}}); } setTimeout(function(){go(0)},0); })();
</script>
</helmet>

<div style="position:relative; min-height:100vh; background:#05060B;">
  <div data-wipe style="position:fixed; inset:0; z-index:9998; background:#05060B; pointer-events:none;"></div>

  <nav style="position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:18px clamp(20px,5vw,64px); background:rgba(7,9,15,.72); backdrop-filter:blur(13px); border-bottom:1px solid rgba(255,255,255,.07);">
    <a href="Portfolio.dc.html" style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; letter-spacing:-.03em; color:#EAECF5;">R<span style="color:#9B6BFF; font-size:13px; vertical-align:super;">2</span></a>
    <a href="Portfolio.dc.html" style="display:inline-flex; align-items:center; gap:9px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#9aa1b8;" style-hover="color:#EAECF5;">&larr; back to home</a>
  </nav>

  <section style="max-width:1280px; margin:0 auto; padding:clamp(46px,7vh,80px) clamp(20px,5vw,64px) clamp(70px,11vh,120px); box-sizing:border-box;">
    <div style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:clamp(34px,5vw,56px);">
      <div>
        <div style="display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:#5b6178; margin-bottom:14px;"><span style="width:7px; height:7px; border-radius:50%; background:#2BF1FF; box-shadow:0 0 8px #2BF1FF;"></span><span>07 /</span> <span style="color:#2BF1FF;">gallery</span></div>
        <h1 style="margin:0; font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:clamp(48px,8.5vw,118px); line-height:.9; letter-spacing:-.01em; color:#EAECF5;">Art and photography</h1>
      </div>
      <div style="text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.14em; color:#5b6178; padding-bottom:8px;"><div style="text-transform:uppercase; margin-bottom:6px;">a second lens on the world</div><div style="color:#2BF1FF;">{{ count }} frames</div></div>
    </div>

    <div class="gmosaic" style="display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:120px; grid-auto-flow:dense; gap:14px;">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="12">
        <div data-gtile class="gtile" onClick="{{ t.onClick }}" style="{{ t.style }}">
          <div class="gzoom" style="position:absolute; inset:0; background:{{ t.g }};"></div>
          <span class="gidx" style="position:absolute; top:12px; left:14px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.14em; color:rgba(255,255,255,.85); text-shadow:0 1px 4px rgba(0,0,0,.5);">{{ t.label }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" onClick="{{ close }}" style="position:fixed; inset:0; z-index:9000; display:flex; align-items:center; justify-content:center; padding:clamp(20px,5vw,70px); background:rgba(4,5,9,.86); backdrop-filter:blur(8px);">
      <button onClick="{{ close }}" aria-label="Close" style="position:absolute; top:22px; right:24px; width:46px; height:46px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#EAECF5; font-size:20px; cursor:pointer;">&times;</button>
      <button onClick="{{ prev }}" aria-label="Previous" style="position:absolute; left:clamp(14px,3vw,40px); top:50%; transform:translateY(-50%); width:50px; height:50px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#EAECF5; font-size:22px; cursor:pointer;">&larr;</button>
      <button onClick="{{ next }}" aria-label="Next" style="position:absolute; right:clamp(14px,3vw,40px); top:50%; transform:translateY(-50%); width:50px; height:50px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#EAECF5; font-size:22px; cursor:pointer;">&rarr;</button>
      <div onClick="{{ stop }}" style="width:min(1000px,92vw); max-height:84vh; aspect-ratio:16/10; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.12); background:{{ openBg }}; box-shadow:0 40px 100px rgba(0,0,0,.6); animation:lbin .35s cubic-bezier(.2,.7,.2,1);"></div>
      <div style="position:absolute; bottom:26px; left:0; right:0; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.16em; color:#9aa1b8;">{{ openCounter }}</div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: null };
  get GRADS() {
    return [
      'radial-gradient(130% 100% at 50% 120%, #ffc06b, #e0633a 22%, #8a2f5e 52%, #1a1430 82%)',
      'radial-gradient(70% 60% at 50% 80%, rgba(190,150,255,.45), transparent 60%), linear-gradient(180deg,#241d40,#0e0a1e)',
      'radial-gradient(circle at 70% 35%, rgba(255,255,255,.95), rgba(170,190,255,.4) 5%, transparent 13%), linear-gradient(160deg,#0b1024,#05060b)',
      'radial-gradient(circle at 62% 40%, #c08bff, #6a3bb0 38%, #2a1850 72%, #0a0814)',
      'radial-gradient(circle at 30% 60%, rgba(120,220,255,.5), transparent 18%), radial-gradient(circle at 65% 35%, rgba(200,140,255,.45), transparent 20%), linear-gradient(160deg,#0a1226,#070a16)',
      'linear-gradient(180deg,#08101f 30%, #1f8a7a 72%, #7ef2c8 98%)',
      'radial-gradient(120% 90% at 50% 115%, #ffd08a, #e8743a 28%, #5e2b50 60%, #120e22 88%)',
      'radial-gradient(circle at 50% 40%, rgba(180,200,230,.5), transparent 55%), linear-gradient(180deg,#3a4458,#10131c)',
      'radial-gradient(circle at 50% 55%, rgba(150,210,255,.85), rgba(80,130,200,.3) 14%, transparent 36%), linear-gradient(160deg,#0a1020,#05070e)',
      'linear-gradient(180deg,#0a1810,#16361f 68%, #2a5a36)',
      'radial-gradient(circle at 42% 58%, #ff7ccd, #7a1e57 42%, #1a0a20 82%)',
      'radial-gradient(circle at 60% 30%, #4a6bd6, #25306b 40%, #0a0e1f 80%)',
    ];
  }
  get SPANS() {
    // [colSpan, rowSpan] per tile for a dense mosaic
    return [[2,3],[1,2],[1,2],[2,2],[1,3],[1,2],[2,2],[1,2],[1,3],[2,2],[1,2],[1,2]];
  }
  componentDidMount() {
    this._key = (e) => {
      if (this.state.open == null) return;
      if (e.key === 'Escape') this.close();
      else if (e.key === 'ArrowLeft') this.prev();
      else if (e.key === 'ArrowRight') this.next();
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { if (this._key) window.removeEventListener('keydown', this._key); }
  open = (i) => () => this.setState({ open: i });
  close = () => this.setState({ open: null });
  stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
  prev = (e) => { this.stop(e); const n = this.GRADS.length; this.setState(s => ({ open: (s.open - 1 + n) % n })); };
  next = (e) => { this.stop(e); const n = this.GRADS.length; this.setState(s => ({ open: (s.open + 1) % n })); };
  renderVals() {
    const grads = this.GRADS, spans = this.SPANS;
    const tiles = grads.map((g, i) => {
      const sp = spans[i] || [1, 2];
      return {
        g,
        label: String(i + 1).padStart(2, '0'),
        style: `grid-column:span ${sp[0]}; grid-row:span ${sp[1]}; position:relative; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,.09); cursor:pointer;`,
        onClick: this.open(i),
      };
    });
    const open = this.state.open != null;
    return {
      count: grads.length,
      tiles,
      open,
      openBg: open ? grads[this.state.open] : 'transparent',
      openCounter: open ? `frame ${String(this.state.open + 1).padStart(2, '0')} / ${grads.length}` : '',
      close: this.close, prev: this.prev, next: this.next, stop: this.stop,
    };
  }
}
</script>
</body>
</html>
