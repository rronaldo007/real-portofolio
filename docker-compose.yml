services:
  web:
    build: .
    image: rr-portfolio
    ports:
      - "8000:8000"
    environment:
      # Override these in production (e.g. via an .env file or your host).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      # Auto-create an admin on first start. The user is only created when a
      # password is set (no default below) — set it in your shell or .env:
      #   DJANGO_SUPERUSER_PASSWORD=... docker compose up
      # Existing users are never modified, so this is safe across restarts.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      # Persist the SQLite database across container restarts.
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
